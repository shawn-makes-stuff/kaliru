# AFC + AFC_ACE (python addons) shaped like a Centauri Carbon with an ACE
# Pro (Originals_Base/addons/cc1_config), on the atmega2560 test machine.
# No ACE is attached: AFC_ACE's serial thread keeps retrying.

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
max_extrude_only_distance: 1000

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 110

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[pause_resume]
[idle_timeout]
[virtual_sdcard]
path: /tmp/kaliru_plugin_state

[gcode_macro _AFC_GLOBAL_VARS]
variable_disable_skew_correction: False
variable_verbose: 2
gcode:

[AFC_prep]
enable: True
delay_time: 0.5

[AFC]
VarFile: /tmp/kaliru_plugin_state/AFC.var
default_material_type: PLA
config_save_method: kalico
load_to_hub: False
homing_enabled: False
enable_assist: False
enable_hub_runout: False
park_pre_load: False
tool_cut: False
park: False
poop: False
kick: False
wipe: False
spool_ratio: 2

[AFC_ACE]
ace: pro
units: 1
hub: ACE_1
extruder: extruder
feed_speed: 50
retract_speed: 75
hub_clear_mm: 65
sensor_approach_mm: 30
sensor_approach_speed: 15
sync_load_mm: 8
dist_hub: 500

[AFC_ACE ACE_1]
serial: /tmp/kaliru_plugin_state/no_ace

[AFC_hub ACE_1]
switch_pin: virtual
enable_hub_runout: False
afc_bowden_length: 8
afc_unload_bowden_length: 45

[AFC_extruder extruder]
pin_tool_start: ^PB2
tool_stn: 51.5
tool_stn_unload: 32
tool_sensor_after_extruder: 0
tool_unload_speed: 15
tool_load_speed: 8
enable_tool_runout: False
