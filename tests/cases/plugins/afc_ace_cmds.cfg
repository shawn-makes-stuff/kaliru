# afc_ace.cfg plus a macro that reads AFC's status through Jinja
[include afc_ace.cfg]

[gcode_macro SHOW_AFC]
gcode:
  {% set afc = printer.AFC %}
  RESPOND MSG="state={afc.current_state} lanes={afc.lanes} map={afc.map_list} units={afc.units}"
  {% for name in afc.lanes %}
    {% set lane = printer['AFC_lane ' ~ name] %}
    RESPOND MSG="{name}: color={lane.color} material={lane.material} weight={lane.weight} map={lane.map} load={lane.load} prep={lane.prep}"
  {% endfor %}

[respond]
