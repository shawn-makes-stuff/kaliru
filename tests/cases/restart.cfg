# a printer restart tears the objects down (kaliru teardown after reactor
# finalize): delayed_gcode and the timers every printer has
[mcu]
serial: /dev/null

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[delayed_gcode later]
initial_duration: 5
gcode:
  M117 later

[display_status]
