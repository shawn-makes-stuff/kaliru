[package]
name = "kaliru"
version = "0.1.0"
edition = "2021"
description = "Kalico (Klipper fork) ported to Rust"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kaliru"
path = "src/main.rs"

[[bin]]
name = "parsedump"
path = "src/bin/parsedump.rs"

[[bin]]
name = "configdump"
path = "src/bin/configdump.rs"

[[bin]]
name = "pinsdump"
path = "src/bin/pinsdump.rs"

[[bin]]
name = "qltest"
path = "src/bin/qltest.rs"

[[bin]]
name = "reactortest"
path = "src/bin/reactortest.rs"

[[bin]]
name = "sqtest"
path = "src/bin/sqtest.rs"

[[bin]]
name = "pysyntax"
path = "src/bin/pysyntax.rs"

[[bin]]
name = "tracedump"
path = "src/bin/tracedump.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
flate2 = "1"
libc = "0.2"
corosensei = "0.3"
minijinja = { version = "2", features = ["custom_syntax", "loop_controls"] }
rustpython-vm = { version = "0.4", default-features = false, features = ["compiler", "freeze-stdlib"], optional = true }
rustpython-stdlib = { version = "0.4", default-features = false, optional = true }
rustpython-pylib = { version = "0.4", features = ["freeze-stdlib"], optional = true }

[features]
# python g-code macros (an embedded RustPython); --no-default-features
# builds without them
default = ["python", "plugins"]
# python plugins (klippy/extras, klippy/plugins modules) on the host's
# CPython 3.15+, loaded only when a config uses one (docs/PLUGINS.md)
plugins = []
python = ["dep:rustpython-vm", "dep:rustpython-stdlib", "dep:rustpython-pylib"]

[profile.release]
# small binaries for printer hosts with little storage: opt-level s is 5.5 MB
# smaller than 3 (24.3 vs 29.7 MB) for the same cpu time over the stock suite
# (5.08 vs 5.04 s); z saves 1.3 MB more for 20% more cpu
opt-level = "s"
strip = true
lto = true
codegen-units = 1

# RustPython with CPython 3.13's exception messages (vendor/README.md)
[patch.crates-io]
rustpython-vm = { path = "vendor/rustpython-vm" }
rustpython-stdlib = { path = "vendor/rustpython-stdlib" }
corosensei = { path = "vendor/corosensei" }
